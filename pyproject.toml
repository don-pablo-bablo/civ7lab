[project]
name = "civ7lab"
version = "1.0.0"
description = "A command-line test bench for Civilization VII mods"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# Standard library only. See the code rules in CONTRIBUTING.md.
dependencies = []

[project.optional-dependencies]
jscheck = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23"]

[project.scripts]
civ7lab = "civ7lab.commands:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "civ7lab[jscheck]"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW1514"]
# PLW1514 flags text I/O with no encoding: Windows would read it as cp1252.
# It is a preview rule, so preview is on for rules named here and no others.
preview = true
explicit-preview-rules = true
